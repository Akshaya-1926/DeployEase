
---
- name: Deploy Java application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create deployment folder
      file:
        path: /var/lib/jenkins/deployease-app
        state: directory
        mode: '0755'

    - name: Copy Java JAR file
      copy:
        src: /var/lib/jenkins/deployease-source/sample-app/target/sample-app-1.0.jar
        dest: /var/lib/jenkins/deployease-app/app.jar
        mode: '0644'
