
---
- name: Deploy Java application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create deployment folder
      ansible.builtin.file:
        path: /var/lib/jenkins/deployease-app
        state: directory
        mode: '0755'

    - name: Copy Java JAR file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/sample-app/target/sample-app-1.0.jar"
        dest: /var/lib/jenkins/deployease-app/app.jar
        mode: '0644'
